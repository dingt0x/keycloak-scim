services:
  postgres:
    image: postgres:17
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - 127.0.0.1:5432:5432
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev
    volumes:
      - ./build/libs/keycloak-scim.jar:/opt/keycloak/providers/keycloak-scim.jar
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      - postgres

volumes:
  db:
